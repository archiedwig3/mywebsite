<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Hub</title>

<style>
:root {
  --bg: #14181d;
  --card: #1e242b;
  --text: #e8e8e8;
  --accent: #5aa8ff;
}

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* HERO */
.hero {
  text-align: center;
  padding: 120px 20px 60px;
  transform: scale(0.9);
  opacity: 0;
  animation: zoomIn 1s ease forwards;
}

@keyframes zoomIn {
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.hero h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

.hero p {
  max-width: 900px;
  margin: auto;
  line-height: 1.7;
  font-size: 16px;
  opacity: 0.85;
}

/* PANELS LAYOUT */
.panel-wrapper {
  display: flex;
  justify-content: center;
  gap: 60px;
  padding: 60px 20px;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.panel {
  width: 320px;
  background: var(--card);
  border-radius: 20px;
  padding: 20px;
  opacity: 0;
  transform: translateY(40px);
  transition: 0.4s;
}

.panel.show {
  opacity: 1;
  transform: translateY(0);
}

.panel:hover {
  box-shadow: 0 0 20px var(--accent);
}

.panel-top {
  display: flex;
  gap: 15px;
}

.panel img {
  width: 60px;
  height: 60px;
  border-radius: 10px;
}

.panel h3 {
  margin: 0;
}

.panel p {
  font-size: 14px;
  opacity: 0.8;
}

.panel button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  border-radius: 999px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
}

.panel button:hover {
  box-shadow: 0 0 10px var(--accent);
}

/* ABOUT */
#about {
  padding: 80px 20px;
  text-align: center;
}

#about p {
  max-width: 900px;
  margin: auto;
  line-height: 1.7;
}

/* FOOTER */
footer {
  margin-top: 80px;
  padding: 30px;
  text-align: center;
  border-top: 1px solid #333;
}

footer a {
  margin: 0 15px;
  color: var(--accent);
  cursor: pointer;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1 id="title"></h1>
  <p id="description"></p>
</section>

<!-- PANELS -->
<div class="panel-wrapper">
  <div class="column" id="leftCol"></div>
  <div class="column" id="rightCol"></div>
</div>

<!-- ABOUT -->
<section id="about">
  <h2>About Us</h2>
  <p id="aboutText"></p>
</section>

<!-- FOOTER -->
<footer>
  <a onclick="scrollToAbout()">About Us</a>
  <a id="contactLink" target="_blank">Contact Us</a>
</footer>

<script>
// ================= CONFIG =================
const config = {
  title: "Theguy Underground",

  description: "This project is built as a central place where you can explore and access a variety of content related to Roblox, Minecraft, and Discord communities. Whether you're looking for tools, servers, resources, or just cool things to check out, this hub is designed to bring everything together in one clean and easy-to-use space. As the project grows, more features, panels, and integrations will be added to expand what you can do here and make everything more accessible.",

  aboutText: "We created this platform to give people more freedom when it comes to discovering and using online tools, communities, and experiences. Instead of having everything scattered across different websites, this hub brings it all into one place where it’s easy to navigate and constantly improving. The goal is to keep things simple, fast, and useful while still allowing room to expand into something much bigger over time. This project is actively being worked on and will continue to evolve with new ideas, improvements, and features.",

  contactLink: "https://discord.gg/CWhyCGfRkz",

  panels: [
    { title: "Our discord server", text: "Join our server for more stuff than you see here!", image: "Discord2.png", button: "Open", link: "https://discord.gg/CWhyCGfRkz" },
    { title: "Minecraft Mods", text: "Find useful Minecraft mods and resources.", image: "Minecraft.png", button: "Open", link: "https://modrinth.com/discover/mods" },
    { title: "Roblox Scripts", text: "Roblox executors from WEAO.XYZ", image: "Roblox.png", button: "Open", link: "https://weao.xyz" },
    { title: "Game Assets", text: "Access assets and builds.", image: "https://via.placeholder.com/60", button: "View", link: "https://example.com" },
    { title: "Scripts", text: "Useful scripts and utilities.", image: "https://via.placeholder.com/60", button: "Check", link: "https://example.com" },
    { title: "Community Hub", text: "See everything in one place.", image: "https://via.placeholder.com/60", button: "Explore", link: "https://example.com" }
  ]
};
// ==========================================

// SET TEXT
document.getElementById("title").innerText = config.title;
document.getElementById("description").innerText = config.description;
document.getElementById("aboutText").innerText = config.aboutText;
document.getElementById("contactLink").href = config.contactLink;

// CREATE PANELS
const left = document.getElementById("leftCol");
const right = document.getElementById("rightCol");

config.panels.forEach((p, i) => {
  const div = document.createElement("div");
  div.className = "panel";

  div.innerHTML = `
    <div class="panel-top">
      <img src="${p.image}">
      <div>
        <h3>${p.title}</h3>
        <p>${p.text}</p>
      </div>
    </div>
    <button onclick="window.open('${p.link}', '_blank')">${p.button}</button>
  `;

  (i % 2 === 0 ? left : right).appendChild(div);

  setTimeout(() => {
    div.classList.add("show");
  }, i * 200);
});

// SCROLL
function scrollToAbout() {
  document.getElementById("about").scrollIntoView({ behavior: "smooth" });
}
</script>

</body>
</html>
